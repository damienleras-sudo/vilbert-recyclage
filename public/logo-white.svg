<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 220" role="img" aria-label="Vilbert Recyclage">
  <defs>
    <linearGradient id="yellowGradW" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5b800"/>
      <stop offset="70%" stop-color="#f5b800"/>
      <stop offset="100%" stop-color="#f5b80000"/>
    </linearGradient>
  </defs>

  <!-- Recycling symbol in white -->
  <g transform="translate(10, 10)">
    <text x="0" y="148" font-size="148" fill="white"
          font-family="'Segoe UI Symbol', 'Apple Color Emoji', sans-serif"
          style="line-height:1">♻</text>
  </g>

  <!-- TOP YELLOW BAR -->
  <rect x="168" y="42" width="402" height="8" rx="4" fill="#f5b800"/>

  <!-- VILBERT in white -->
  <text x="168" y="138"
        font-size="100"
        font-weight="900"
        font-family="'Arial Black', 'Impact', 'Franklin Gothic Heavy', sans-serif"
        fill="white"
        letter-spacing="-2">VILBERT</text>

  <!-- BOTTOM GRADIENT BAR -->
  <rect x="168" y="155" width="130" height="11" rx="4" fill="url(#yellowGradW)"/>

  <!-- RECYCLAGE in white -->
  <text x="314" y="167"
        font-size="36"
        font-weight="600"
        font-family="'Arial', 'Helvetica Neue', sans-serif"
        fill="white"
        letter-spacing="7">RECYCLAGE</text>
</svg>
